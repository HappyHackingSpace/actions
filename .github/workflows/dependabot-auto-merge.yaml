name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      merge-method:
        description: "Merge method (merge, squash, rebase)."
        type: string
        default: squash
      timeout-minutes:
        description: "How long to wait for the other checks on the PR."
        type: number
        default: 60

permissions: {}

jobs:
  metadata:
    # A human pushing to a Dependabot branch must not trigger an unattended merge.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ecosystem: ${{ steps.meta.outputs.package-ecosystem }}
      update-type: ${{ steps.meta.outputs.update-type }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

  compat-checks:
    needs: metadata
    runs-on: ubuntu-latest
    # Runs the updated dependency's install scripts, so it gets a read-only token and no merge rights.
    permissions:
      contents: read
    outputs:
      checked: ${{ steps.compat.outputs.checked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: compat
        uses: HappyHackingSpace/actions/dependabot/compat-checks@v1
        with:
          ecosystem: ${{ needs.metadata.outputs.ecosystem }}

  merge:
    needs: [metadata, compat-checks]
    if: needs.metadata.outputs.update-type != 'version-update:semver-major'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - uses: HappyHackingSpace/actions/pr/wait-checks@v1
        with:
          # Without our own compat check, only the repo's CI can vouch for the update.
          require-checks: ${{ needs.compat-checks.outputs.checked != 'true' }}
          timeout-minutes: ${{ inputs.timeout-minutes }}
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        # Allowlist the method so the input can never become a flag like --admin.
        run: |
          case "$MERGE_METHOD" in merge|squash|rebase) ;; *) echo "::error::invalid merge-method: $MERGE_METHOD"; exit 1 ;; esac
          gh pr merge "$PR_URL" "--$MERGE_METHOD" --match-head-commit "$HEAD_SHA"
