# Reusable link checker for markdown-heavy repositories (awesome lists, docs).
# Call it from a repo workflow:
#
#   jobs:
#     links:
#       uses: HappyHackingSpace/actions/.github/workflows/link-check.yaml@v1
#
name: Link Check

on:
  workflow_call:
    inputs:
      paths:
        description: "Space-separated files/globs to check"
        required: false
        type: string
        default: "'**/*.md'"
      extra-args:
        description: "Extra lychee arguments"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --accept '200..=206,429'
            --timeout 20
            --max-retries 2
            ${{ inputs.extra-args }}
            ${{ inputs.paths }}
          fail: true
        env:
          # Avoids anonymous rate limits on github.com links
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
