name: Dependabot compatibility checks
description: Install, build and test every project of the updated ecosystem to catch breaking dependency updates.

inputs:
  ecosystem:
    description: "Dependabot package ecosystem, as reported by dependabot/fetch-metadata (e.g. npm_and_yarn, go_modules)."
    required: true

outputs:
  checked:
    description: "Whether this ecosystem has a compatibility check. When false, nothing was verified."
    value: ${{ steps.plan.outputs.checked }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
      run: $GITHUB_ACTION_PATH/plan.sh

    - if: inputs.ecosystem == 'npm_and_yarn' || inputs.ecosystem == 'bun'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ steps.plan.outputs.node-version-file }}
        node-version: ${{ steps.plan.outputs.node-version-file == '' && 'lts/*' || '' }}

    - if: inputs.ecosystem == 'go_modules'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.plan.outputs.go-version-file }}
        cache: false

    - if: inputs.ecosystem == 'pip' || inputs.ecosystem == 'uv'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: ${{ steps.plan.outputs.python-version-file }}
        python-version: ${{ steps.plan.outputs.python-version-file == '' && '3.x' || '' }}
    - if: inputs.ecosystem == 'uv'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - if: steps.plan.outputs.checked == 'true'
      shell: bash
      env:
        INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
        CI: "true"
      run: $GITHUB_ACTION_PATH/check.sh
